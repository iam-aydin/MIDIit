<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice to Kick MIDI</title>
<style>
  :root{
      --bg:#13222a; --panel:#1b2f39; --ink:#ece8dc; --dim:#8fa5ad; --amber:#f2b134; --amber-d:#c98c14;
        }
          *{box-sizing:border-box}
            html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
              body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;
                     padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
                       h1{font-size:22px;margin:6px 0 0;font-weight:700;letter-spacing:.2px}
                         #status{min-height:22px;font-size:15px;color:var(--dim);text-align:center}
                           canvas{width:100%;max-width:380px;height:110px;background:var(--panel);border-radius:14px}
                             #rec{width:150px;height:150px;border-radius:50%;border:0;background:var(--amber);color:#2a1d00;
                                    font-size:20px;font-weight:700;box-shadow:0 0 0 8px rgba(242,177,52,.15);transition:transform .08s}
                                      #rec:active{transform:scale(.96)}
                                        #rec.on{background:#e8553b;color:#fff;box-shadow:0 0 0 8px rgba(232,85,59,.25)}
                                          .row{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--dim)}
                                            .row label{display:flex;flex-direction:column;gap:6px}
                                              input[type=range]{width:100%;accent-color:var(--amber)}
                                                select{padding:10px;border-radius:10px;border:0;background:var(--panel);color:var(--ink);font-size:15px}
                                                  .btns{width:100%;max-width:380px;display:flex;gap:10px}
                                                    .btns button,.file{flex:1;padding:14px 10px;border:0;border-radius:12px;background:var(--panel);color:var(--ink);
                                                           font-size:16px;text-align:center}
                                                             .btns button:disabled{opacity:.35}
                                                               .btns button:focus-visible,#rec:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
                                                                 .file{display:block;width:100%;max-width:380px;cursor:pointer}
                                                                   .file input{display:none}
                                                                     .hint{font-size:12px;color:var(--dim);max-width:380px;text-align:center;line-height:1.5}
                                                                     </style>
                                                                     </head>
                                                                     <body>
                                                                     <h1>Voice to Kick MIDI</h1>
                                                                     <div id="status">Tap Record and say "boom, boom, boom boom".</div>
                                                                     <canvas id="cv" width="380" height="110"></canvas>

                                                                     <button id="rec">Record</button>

                                                                     <label class="file">Or pick / record an audio file
                                                                       <input type="file" id="file" accept="audio/*" capture>
                                                                       </label>

                                                                       <div class="row">
                                                                         <label>Sensitivity: <b id="sv" style="color:var(--ink)">50</b>
                                                                             <input type="range" id="sens" min="10" max="90" value="50"></label>
                                                                               <label>Snap to grid
                                                                                   <select id="grid">
                                                                                         <option value="0">Off (keep raw timing)</option>
                                                                                               <option value="4" selected>1/16 notes</option>
                                                                                                     <option value="2">1/8 notes</option>
                                                                                                         </select></label>
                                                                                                         </div>

                                                                                                         <div class="btns">
                                                                                                           <button id="play" disabled>Preview</button>
                                                                                                             <button id="dl" disabled>Download MIDI</button>
                                                                                                             </div>
                                                                                                             <div class="hint">Kicks are written as MIDI note 36 on channel 10. Change sensitivity or grid, then tap Record again or re-pick the file.</div>

                                                                                                             <script>
                                                                                                             const $ = id => document.getElementById(id);
                                                                                                             let ctx, stream, analyser, buf, rafId, recording = false;
                                                                                                             let env = [], times = [], startT = 0;
                                                                                                             let hits = [], bpm = 120;

                                                                                                             $('sens').oninput = e => { $('sv').textContent = e.target.value; if (env.length) analyse(); };
                                                                                                             $('grid').onchange = () => { if (env.length) analyse(); };

                                                                                                             function getCtx() {
                                                                                                               ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
                                                                                                                 return ctx;
                                                                                                                 }

                                                                                                                 /* ---------- live recording ---------- */
                                                                                                                 async function startRec() {
                                                                                                                   if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                                                                                                                       $('status').textContent = 'Mic not available here. Use the file option below, or host this page on https.';
                                                                                                                           return;
                                                                                                                             }
                                                                                                                               getCtx(); await ctx.resume();
                                                                                                                                 stream = await navigator.mediaDevices.getUserMedia({
                                                                                                                                     audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                                                                                                                                       });
                                                                                                                                         const src = ctx.createMediaStreamSource(stream);
                                                                                                                                           analyser = ctx.createAnalyser();
                                                                                                                                             analyser.fftSize = 1024;
                                                                                                                                               src.connect(analyser);
                                                                                                                                                 buf = new Float32Array(analyser.fftSize);
                                                                                                                                                   env = []; times = []; startT = ctx.currentTime; recording = true;
                                                                                                                                                     $('rec').textContent = 'Stop'; $('rec').classList.add('on');
                                                                                                                                                       $('status').textContent = 'Listening...';
                                                                                                                                                         loop();
                                                                                                                                                         }

                                                                                                                                                         function loop() {
                                                                                                                                                           if (!recording) return;
                                                                                                                                                             analyser.getFloatTimeDomainData(buf);
                                                                                                                                                               let s = 0;
                                                                                                                                                                 for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
                                                                                                                                                                   env.push(Math.sqrt(s / buf.length));
                                                                                                                                                                     times.push(ctx.currentTime - startT);
                                                                                                                                                                       draw();
                                                                                                                                                                         rafId = requestAnimationFrame(loop);
                                                                                                                                                                         }

                                                                                                                                                                         function stopRec() {
                                                                                                                                                                           recording = false; cancelAnimationFrame(rafId);
                                                                                                                                                                             stream.getTracks().forEach(t => t.stop());
                                                                                                                                                                               $('rec').textContent = 'Record'; $('rec').classList.remove('on');
                                                                                                                                                                                 analyse();
                                                                                                                                                                                 }

                                                                                                                                                                                 /* ---------- audio file fallback ---------- */
                                                                                                                                                                                 $('file').onchange = async e => {
                                                                                                                                                                                   const f = e.target.files[0];
                                                                                                                                                                                     if (!f) return;
                                                                                                                                                                                       try {
                                                                                                                                                                                           $('status').textContent = 'Reading file...';
                                                                                                                                                                                               getCtx();
                                                                                                                                                                                                   const audio = await ctx.decodeAudioData(await f.arrayBuffer());
                                                                                                                                                                                                       const data = audio.getChannelData(0);
                                                                                                                                                                                                           const win = 1024, hop = 512;
                                                                                                                                                                                                               env = []; times = [];
                                                                                                                                                                                                                   for (let i = 0; i + win < data.length; i += hop) {
                                                                                                                                                                                                                         let s = 0;
                                                                                                                                                                                                                               for (let k = 0; k < win; k++) s += data[i + k] * data[i + k];
                                                                                                                                                                                                                                     env.push(Math.sqrt(s / win));
                                                                                                                                                                                                                                           times.push(i / audio.sampleRate);
                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                   draw(); analyse();
                                                                                                                                                                                                                                                     } catch (err) {
                                                                                                                                                                                                                                                         $('status').textContent = 'Could not read that file: ' + err.message;
                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                           };

                                                                                                                                                                                                                                                           function draw() {
                                                                                                                                                                                                                                                             const c = $('cv'), g = c.getContext('2d');
                                                                                                                                                                                                                                                               g.clearRect(0, 0, c.width, c.height);
                                                                                                                                                                                                                                                                 if (!env.length) return;
                                                                                                                                                                                                                                                                   const max = Math.max(...env, 0.02);
                                                                                                                                                                                                                                                                     g.fillStyle = '#f2b134';
                                                                                                                                                                                                                                                                       const n = Math.min(env.length, c.width);
                                                                                                                                                                                                                                                                         for (let i = 0; i < n; i++) {
                                                                                                                                                                                                                                                                             const idx = env.length > c.width ? Math.floor(i * env.length / c.width) : env.length - n + i;
                                                                                                                                                                                                                                                                                 const h = Math.min(c.height, env[idx] / max * c.height * 0.9);
                                                                                                                                                                                                                                                                                     g.fillRect(i, c.height - h, 1, h);
                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                       }

                                                                                                                                                                                                                                                                                       /* ---------- onset detection ---------- */
                                                                                                                                                                                                                                                                                       function analyse() {
                                                                                                                                                                                                                                                                                         if (env.length < 10) { $('status').textContent = 'Too short, try again.'; return; }
                                                                                                                                                                                                                                                                                           const sm = env.map((v, i) => {
                                                                                                                                                                                                                                                                                               let a = 0, c = 0;
                                                                                                                                                                                                                                                                                                   for (let k = -1; k <= 1; k++) if (env[i + k] !== undefined) { a += env[i + k]; c++; }
                                                                                                                                                                                                                                                                                                       return a / c;
                                                                                                                                                                                                                                                                                                         });
                                                                                                                                                                                                                                                                                                           let max = 0; for (const v of sm) if (v > max) max = v;
                                                                                                                                                                                                                                                                                                             if (max < 0.01) { $('status').textContent = 'Heard almost nothing. Try louder or closer to the mic.'; return; }

                                                                                                                                                                                                                                                                                                               const sens = +$('sens').value / 100;
                                                                                                                                                                                                                                                                                                                 const thresh = max * (0.55 - sens * 0.45);
                                                                                                                                                                                                                                                                                                                   hits = [];
                                                                                                                                                                                                                                                                                                                     let lastHit = -1, armed = true;
                                                                                                                                                                                                                                                                                                                       for (let i = 2; i < sm.length; i++) {
                                                                                                                                                                                                                                                                                                                           const rise = sm[i] - sm[i - 2];
                                                                                                                                                                                                                                                                                                                               if (armed && sm[i] > thresh && rise > thresh * 0.5) {
                                                                                                                                                                                                                                                                                                                                     const t = times[i];
                                                                                                                                                                                                                                                                                                                                           if (lastHit < 0 || t - lastHit > 0.09) {
                                                                                                                                                                                                                                                                                                                                                   hits.push({ t, vel: Math.max(30, Math.min(127, Math.round(sm[i] / max * 127))) });
                                                                                                                                                                                                                                                                                                                                                           lastHit = t; armed = false;
                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                         if (sm[i] < thresh * 0.6) armed = true;
                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                             if (!hits.length) { $('status').textContent = 'No hits found. Raise sensitivity.'; return; }

                                                                                                                                                                                                                                                                                                                                                                               // tempo guess from the median gap between hits
                                                                                                                                                                                                                                                                                                                                                                                 if (hits.length > 1) {
                                                                                                                                                                                                                                                                                                                                                                                     const gaps = [];
                                                                                                                                                                                                                                                                                                                                                                                         for (let i = 1; i < hits.length; i++) gaps.push(hits[i].t - hits[i - 1].t);
                                                                                                                                                                                                                                                                                                                                                                                             gaps.sort((a, b) => a - b);
                                                                                                                                                                                                                                                                                                                                                                                                 let b = 60 / gaps[Math.floor(gaps.length / 2)];
                                                                                                                                                                                                                                                                                                                                                                                                     while (b < 80) b *= 2;
                                                                                                                                                                                                                                                                                                                                                                                                         while (b > 180) b /= 2;
                                                                                                                                                                                                                                                                                                                                                                                                             bpm = Math.round(b);
                                                                                                                                                                                                                                                                                                                                                                                                               } else bpm = 120;

                                                                                                                                                                                                                                                                                                                                                                                                                 const t0 = hits[0].t;
                                                                                                                                                                                                                                                                                                                                                                                                                   hits.forEach(h => h.t -= t0);

                                                                                                                                                                                                                                                                                                                                                                                                                     const div = +$('grid').value;
                                                                                                                                                                                                                                                                                                                                                                                                                       if (div > 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                           const step = 60 / bpm / div;
                                                                                                                                                                                                                                                                                                                                                                                                                               hits.forEach(h => h.t = Math.round(h.t / step) * step);
                                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                                   $('status').textContent = hits.length + ' kicks found, about ' + bpm + ' BPM';
                                                                                                                                                                                                                                                                                                                                                                                                                                     $('play').disabled = false; $('dl').disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                     }

                                                                                                                                                                                                                                                                                                                                                                                                                                     /* ---------- preview ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                                     function kick(when, vel) {
                                                                                                                                                                                                                                                                                                                                                                                                                                       const o = ctx.createOscillator(), g = ctx.createGain();
                                                                                                                                                                                                                                                                                                                                                                                                                                         o.type = 'sine';
                                                                                                                                                                                                                                                                                                                                                                                                                                           o.frequency.setValueAtTime(150, when);
                                                                                                                                                                                                                                                                                                                                                                                                                                             o.frequency.exponentialRampToValueAtTime(45, when + 0.12);
                                                                                                                                                                                                                                                                                                                                                                                                                                               g.gain.setValueAtTime(vel / 127, when);
                                                                                                                                                                                                                                                                                                                                                                                                                                                 g.gain.exponentialRampToValueAtTime(0.001, when + 0.35);
                                                                                                                                                                                                                                                                                                                                                                                                                                                   o.connect(g).connect(ctx.destination);
                                                                                                                                                                                                                                                                                                                                                                                                                                                     o.start(when); o.stop(when + 0.4);
                                                                                                                                                                                                                                                                                                                                                                                                                                                     }
                                                                                                                                                                                                                                                                                                                                                                                                                                                     $('play').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                       getCtx(); ctx.resume();
                                                                                                                                                                                                                                                                                                                                                                                                                                                         const now = ctx.currentTime + 0.1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                           hits.forEach(h => kick(now + h.t, h.vel));
                                                                                                                                                                                                                                                                                                                                                                                                                                                           };

                                                                                                                                                                                                                                                                                                                                                                                                                                                           /* ---------- MIDI file ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                                                           function vlq(n) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                             const out = [n & 0x7f];
                                                                                                                                                                                                                                                                                                                                                                                                                                                               while ((n >>= 7) > 0) out.unshift((n & 0x7f) | 0x80);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                 return out;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                 }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                 function buildMidi() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                   const ppq = 480, us = Math.round(60000000 / bpm), trk = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                     trk.push(0x00, 0xFF, 0x51, 0x03, (us >> 16) & 255, (us >> 8) & 255, us & 255);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                       trk.push(0x00, 0xFF, 0x03, 0x04, 75, 105, 99, 107); // track name "Kick"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const ticks = s => Math.round(s * (bpm / 60) * ppq);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const ev = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                             hits.forEach(h => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const on = ticks(h.t);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     ev.push({ tick: on, data: [0x99, 36, h.vel] });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         ev.push({ tick: on + ppq / 8, data: [0x89, 36, 0] });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             ev.sort((a, b) => a.tick - b.tick);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               let last = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 ev.forEach(e => { trk.push(...vlq(e.tick - last), ...e.data); last = e.tick; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   trk.push(0x00, 0xFF, 0x2F, 0x00);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     const head = [0x4d,0x54,0x68,0x64, 0,0,0,6, 0,0, 0,1, (ppq >> 8) & 255, ppq & 255];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const len = trk.length;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const th = [0x4d,0x54,0x72,0x6b, (len >> 24) & 255, (len >> 16) & 255, (len >> 8) & 255, len & 255];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           return new Uint8Array([...head, ...th, ...trk]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           $('dl').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const blob = new Blob([buildMidi()], { type: 'audio/midi' });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               const a = document.createElement('a');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 a.href = URL.createObjectURL(blob);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   a.download = 'voice-kicks.mid';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     document.body.appendChild(a); a.click(); a.remove();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     $('rec').onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       recording ? stopRec() : startRec().catch(e => { $('status').textContent = 'Mic error: ' + e.message; });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       </html>
