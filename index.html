<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice to Violin MIDI</title>
<style>
  :root{
      --bg:#13222a; --panel:#1b2f39; --ink:#ece8dc; --dim:#8fa5ad; --amber:#f2b134;
        }
          *{box-sizing:border-box}
            html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
              body{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;
                     padding:max(20px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom))}
                       h1{font-size:22px;margin:6px 0 0;font-weight:700;letter-spacing:.2px}
                         #status{min-height:22px;font-size:15px;color:var(--dim);text-align:center}
                           canvas{width:100%;max-width:380px;height:130px;background:var(--panel);border-radius:14px}
                             #rec{width:150px;height:150px;border-radius:50%;border:0;background:var(--amber);color:#2a1d00;
                                    font-size:20px;font-weight:700;box-shadow:0 0 0 8px rgba(242,177,52,.15);transition:transform .08s}
                                      #rec:active{transform:scale(.96)}
                                        #rec.on{background:#e8553b;color:#fff;box-shadow:0 0 0 8px rgba(232,85,59,.25)}
                                          .row{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;font-size:14px;color:var(--dim)}
                                            .row label{display:flex;flex-direction:column;gap:6px}
                                              input[type=range]{width:100%;accent-color:var(--amber)}
                                                select{padding:10px;border-radius:10px;border:0;background:var(--panel);color:var(--ink);font-size:15px}
                                                  .btns{width:100%;max-width:380px;display:flex;gap:10px}
                                                    .btns button,.file{flex:1;padding:14px 10px;border:0;border-radius:12px;background:var(--panel);color:var(--ink);
                                                           font-size:16px;text-align:center}
                                                             .btns button:disabled{opacity:.35}
                                                               .btns button:focus-visible,#rec:focus-visible,select:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
                                                                 .file{display:block;width:100%;max-width:380px;cursor:pointer}
                                                                   .file input{display:none}
                                                                     .hint{font-size:12px;color:var(--dim);max-width:380px;text-align:center;line-height:1.5}
                                                                     </style>
                                                                     </head>
                                                                     <body>
                                                                     <h1>Voice to Violin MIDI</h1>
                                                                     <div id="status">Tap Record and hum or sing a melody, one note at a time.</div>
                                                                     <canvas id="cv" width="380" height="130"></canvas>

                                                                     <button id="rec">Record</button>

                                                                     <label class="file">Or pick / record an audio file
                                                                       <input type="file" id="file" accept="audio/*" capture>
                                                                       </label>

                                                                       <div class="row">
                                                                         <label>Sensitivity: <b id="sv" style="color:var(--ink)">50</b>
                                                                             <input type="range" id="sens" min="10" max="90" value="50"></label>
                                                                               <label>Octave shift (violin sits higher than a voice)
                                                                                   <select id="oct">
                                                                                         <option value="0">None</option>
                                                                                               <option value="12" selected>Up 1 octave</option>
                                                                                                     <option value="24">Up 2 octaves</option>
                                                                                                         </select></label>
                                                                                                           <label>Snap to grid
                                                                                                               <select id="grid">
                                                                                                                     <option value="0">Off (keep raw timing)</option>
                                                                                                                           <option value="4" selected>1/16 notes</option>
                                                                                                                                 <option value="2">1/8 notes</option>
                                                                                                                                     </select></label>
                                                                                                                                     </div>

                                                                                                                                     <div class="btns">
                                                                                                                                       <button id="play" disabled>Preview</button>
                                                                                                                                         <button id="dl" disabled>Download MIDI</button>
                                                                                                                                         </div>
                                                                                                                                         <div class="hint">Exports MIDI program 41 (Violin) on channel 1. Change a setting to re-analyse the same take.</div>

                                                                                                                                         <script>
                                                                                                                                         const $ = id => document.getElementById(id);
                                                                                                                                         let ctx, stream, analyser, buf, rafId, recording = false;
                                                                                                                                         let frames = [];            // {t, rms, f, clar}
                                                                                                                                         let notes = [], bpm = 120, startT = 0;
                                                                                                                                         const LOW = 55, HIGH = 103; // violin range: G3 to G7

                                                                                                                                         $('sens').oninput = e => { $('sv').textContent = e.target.value; if (frames.length) analyse(); };
                                                                                                                                         $('grid').onchange = () => { if (frames.length) analyse(); };
                                                                                                                                         $('oct').onchange = () => { if (notes.length) drawRoll(); };

                                                                                                                                         function getCtx() {
                                                                                                                                           ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
                                                                                                                                             return ctx;
                                                                                                                                             }

                                                                                                                                             /* ---------- pitch detection (YIN) ---------- */
                                                                                                                                             function detectPitch(x, sr) {
                                                                                                                                               const W = 1024;
                                                                                                                                                 const minT = Math.floor(sr / 1000);
                                                                                                                                                   const maxT = Math.min(Math.floor(sr / 70), x.length - W - 1);
                                                                                                                                                     if (maxT <= minT) return { f: 0, clar: 0 };
                                                                                                                                                       const d = new Float32Array(maxT + 1);
                                                                                                                                                         for (let tau = 1; tau <= maxT; tau++) {
                                                                                                                                                             let s = 0;
                                                                                                                                                                 for (let j = 0; j < W; j++) { const df = x[j] - x[j + tau]; s += df * df; }
                                                                                                                                                                     d[tau] = s;
                                                                                                                                                                       }
                                                                                                                                                                         const c = new Float32Array(maxT + 1);
                                                                                                                                                                           c[0] = 1;
                                                                                                                                                                             let run = 0;
                                                                                                                                                                               for (let tau = 1; tau <= maxT; tau++) {
                                                                                                                                                                                   run += d[tau];
                                                                                                                                                                                       c[tau] = run ? d[tau] * tau / run : 1;
                                                                                                                                                                                         }
                                                                                                                                                                                           let tau = -1;
                                                                                                                                                                                             for (let t = minT; t <= maxT; t++) {
                                                                                                                                                                                                 if (c[t] < 0.15) {
                                                                                                                                                                                                       while (t + 1 <= maxT && c[t + 1] < c[t]) t++;
                                                                                                                                                                                                             tau = t; break;
                                                                                                                                                                                                                 }
                                                                                                                                                                                                                   }
                                                                                                                                                                                                                     if (tau < 0) return { f: 0, clar: 0 };
                                                                                                                                                                                                                       let better = tau;
                                                                                                                                                                                                                         if (tau > 1 && tau < maxT) {
                                                                                                                                                                                                                             const a = c[tau - 1], b = c[tau], cc = c[tau + 1];
                                                                                                                                                                                                                                 const den = 2 * (2 * b - a - cc);
                                                                                                                                                                                                                                     if (den) better = tau + (cc - a) / den;
                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                         return { f: sr / better, clar: 1 - c[tau] };
                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                         function rmsOf(x, n) {
                                                                                                                                                                                                                                           let s = 0;
                                                                                                                                                                                                                                             for (let i = 0; i < n; i++) s += x[i] * x[i];
                                                                                                                                                                                                                                               return Math.sqrt(s / n);
                                                                                                                                                                                                                                               }

                                                                                                                                                                                                                                               /* ---------- live recording ---------- */
                                                                                                                                                                                                                                               async function startRec() {
                                                                                                                                                                                                                                                 if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                                                                                                                                                                                                                                                     $('status').textContent = 'Mic not available here. Use the file option below, or host this page on https.';
                                                                                                                                                                                                                                                         return;
                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                             getCtx(); await ctx.resume();
                                                                                                                                                                                                                                                               stream = await navigator.mediaDevices.getUserMedia({
                                                                                                                                                                                                                                                                   audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                                                                                                                                                                                                                                                                     });
                                                                                                                                                                                                                                                                       const src = ctx.createMediaStreamSource(stream);
                                                                                                                                                                                                                                                                         analyser = ctx.createAnalyser();
                                                                                                                                                                                                                                                                           analyser.fftSize = 2048;
                                                                                                                                                                                                                                                                             src.connect(analyser);
                                                                                                                                                                                                                                                                               buf = new Float32Array(analyser.fftSize);
                                                                                                                                                                                                                                                                                 frames = []; notes = []; startT = ctx.currentTime; recording = true;
                                                                                                                                                                                                                                                                                   $('play').disabled = true; $('dl').disabled = true;
                                                                                                                                                                                                                                                                                     $('rec').textContent = 'Stop'; $('rec').classList.add('on');
                                                                                                                                                                                                                                                                                       $('status').textContent = 'Listening...';
                                                                                                                                                                                                                                                                                         loop();
                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                         function loop() {
                                                                                                                                                                                                                                                                                           if (!recording) return;
                                                                                                                                                                                                                                                                                             analyser.getFloatTimeDomainData(buf);
                                                                                                                                                                                                                                                                                               const rms = rmsOf(buf, buf.length);
                                                                                                                                                                                                                                                                                                 let f = 0, clar = 0;
                                                                                                                                                                                                                                                                                                   if (rms > 0.005) { const p = detectPitch(buf, ctx.sampleRate); f = p.f; clar = p.clar; }
                                                                                                                                                                                                                                                                                                     frames.push({ t: ctx.currentTime - startT, rms, f, clar });
                                                                                                                                                                                                                                                                                                       drawLive();
                                                                                                                                                                                                                                                                                                         rafId = requestAnimationFrame(loop);
                                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                                         function stopRec() {
                                                                                                                                                                                                                                                                                                           recording = false; cancelAnimationFrame(rafId);
                                                                                                                                                                                                                                                                                                             stream.getTracks().forEach(t => t.stop());
                                                                                                                                                                                                                                                                                                               $('rec').textContent = 'Record'; $('rec').classList.remove('on');
                                                                                                                                                                                                                                                                                                                 analyse();
                                                                                                                                                                                                                                                                                                                 }

                                                                                                                                                                                                                                                                                                                 /* ---------- audio file fallback ---------- */
                                                                                                                                                                                                                                                                                                                 $('file').onchange = async e => {
                                                                                                                                                                                                                                                                                                                   const f = e.target.files[0];
                                                                                                                                                                                                                                                                                                                     if (!f) return;
                                                                                                                                                                                                                                                                                                                       try {
                                                                                                                                                                                                                                                                                                                           $('status').textContent = 'Reading file...';
                                                                                                                                                                                                                                                                                                                               getCtx();
                                                                                                                                                                                                                                                                                                                                   const audio = await ctx.decodeAudioData(await f.arrayBuffer());
                                                                                                                                                                                                                                                                                                                                       const data = audio.getChannelData(0);
                                                                                                                                                                                                                                                                                                                                           const sr = audio.sampleRate, win = 2048, hop = 1024;
                                                                                                                                                                                                                                                                                                                                               const limit = Math.min(data.length, sr * 30); // first 30 seconds
                                                                                                                                                                                                                                                                                                                                                   frames = [];
                                                                                                                                                                                                                                                                                                                                                       for (let i = 0; i + win <= limit; i += hop) {
                                                                                                                                                                                                                                                                                                                                                             const x = data.subarray(i, i + win);
                                                                                                                                                                                                                                                                                                                                                                   const rms = rmsOf(x, win);
                                                                                                                                                                                                                                                                                                                                                                         let fr = 0, clar = 0;
                                                                                                                                                                                                                                                                                                                                                                               if (rms > 0.005) { const p = detectPitch(x, sr); fr = p.f; clar = p.clar; }
                                                                                                                                                                                                                                                                                                                                                                                     frames.push({ t: i / sr, rms, f: fr, clar });
                                                                                                                                                                                                                                                                                                                                                                                           if ((i / hop) % 40 === 0) await new Promise(r => setTimeout(r, 0)); // keep the page responsive
                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                   analyse();
                                                                                                                                                                                                                                                                                                                                                                                                     } catch (err) {
                                                                                                                                                                                                                                                                                                                                                                                                         $('status').textContent = 'Could not read that file: ' + err.message;
                                                                                                                                                                                                                                                                                                                                                                                                           }
                                                                                                                                                                                                                                                                                                                                                                                                           };

                                                                                                                                                                                                                                                                                                                                                                                                           /* ---------- drawing ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                           function drawLive() {
                                                                                                                                                                                                                                                                                                                                                                                                             const c = $('cv'), g = c.getContext('2d');
                                                                                                                                                                                                                                                                                                                                                                                                               g.clearRect(0, 0, c.width, c.height);
                                                                                                                                                                                                                                                                                                                                                                                                                 g.fillStyle = '#f2b134';
                                                                                                                                                                                                                                                                                                                                                                                                                   const n = Math.min(frames.length, c.width);
                                                                                                                                                                                                                                                                                                                                                                                                                     for (let i = 0; i < n; i++) {
                                                                                                                                                                                                                                                                                                                                                                                                                         const fr = frames[frames.length - n + i];
                                                                                                                                                                                                                                                                                                                                                                                                                             const h = Math.min(c.height, fr.rms * c.height * 6);
                                                                                                                                                                                                                                                                                                                                                                                                                                 g.fillRect(i, c.height - h, 1, h);
                                                                                                                                                                                                                                                                                                                                                                                                                                   }
                                                                                                                                                                                                                                                                                                                                                                                                                                   }

                                                                                                                                                                                                                                                                                                                                                                                                                                   function shift() { return +$('oct').value; }
                                                                                                                                                                                                                                                                                                                                                                                                                                   function outMidi(n) { return Math.max(LOW, Math.min(HIGH, n.midi + shift())); }

                                                                                                                                                                                                                                                                                                                                                                                                                                   function drawRoll() {
                                                                                                                                                                                                                                                                                                                                                                                                                                     const c = $('cv'), g = c.getContext('2d');
                                                                                                                                                                                                                                                                                                                                                                                                                                       g.clearRect(0, 0, c.width, c.height);
                                                                                                                                                                                                                                                                                                                                                                                                                                         if (!notes.length) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                           const total = Math.max(...notes.map(n => n.t + n.dur));
                                                                                                                                                                                                                                                                                                                                                                                                                                             let lo = Infinity, hi = -Infinity;
                                                                                                                                                                                                                                                                                                                                                                                                                                               notes.forEach(n => { const m = outMidi(n); lo = Math.min(lo, m); hi = Math.max(hi, m); });
                                                                                                                                                                                                                                                                                                                                                                                                                                                 const span = Math.max(12, hi - lo + 2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                   const base = lo - 1;
                                                                                                                                                                                                                                                                                                                                                                                                                                                     g.fillStyle = '#f2b134';
                                                                                                                                                                                                                                                                                                                                                                                                                                                       notes.forEach(n => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                           const x = n.t / total * (c.width - 4) + 2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                               const w = Math.max(3, n.dur / total * (c.width - 4));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                   const y = c.height - ((outMidi(n) - base) / span) * (c.height - 8) - 6;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                       g.fillRect(x, y, w, 5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                         });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                         }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                         /* ---------- note extraction ---------- */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                         function median(a) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const s = a.slice().sort((x, y) => x - y);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                             return s[Math.floor(s.length / 2)];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                             }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                             function analyse() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (frames.length < 8) { $('status').textContent = 'Too short, try again.'; return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 let maxRms = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   for (const fr of frames) if (fr.rms > maxRms) maxRms = fr.rms;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (maxRms < 0.01) { $('status').textContent = 'Heard almost nothing. Try louder or closer to the mic.'; return; }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const sens = +$('sens').value / 100;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const gate = maxRms * (0.30 - sens * 0.25);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const dt = (frames[frames.length - 1].t - frames[0].t) / (frames.length - 1);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const raw = [];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               let cur = null, gap = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 const close = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     if (!cur) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         const end = cur.last + dt;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             const dur = end - cur.start;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 if (dur >= 0.07) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       const meanRms = cur.rms.reduce((a, b) => a + b, 0) / cur.rms.length;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             raw.push({
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     t: cur.start, dur,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                             midi: Math.round(median(cur.ms)),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     vel: Math.max(40, Math.min(127, Math.round(meanRms / maxRms * 127)))
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   cur = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       for (const fr of frames) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const voiced = fr.rms >= gate && fr.clar >= 0.6 && fr.f >= 70 && fr.f <= 1000;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                               if (voiced) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     const m = 69 + 12 * Math.log2(fr.f / 440);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           if (cur && Math.abs(m - cur.ref) < 0.75) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   cur.ms.push(m); cur.rms.push(fr.rms); cur.last = fr.t; gap = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           const tail = cur.ms.slice(-5);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                   cur.ref = tail.reduce((a, b) => a + b, 0) / tail.length;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 close();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                         cur = { start: fr.t, last: fr.t, ms: [m], rms: [fr.rms], ref: m };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 gap = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           } else if (cur) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                 gap++;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                       if (gap > 3) { close(); gap = 0; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                           }
